<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Poverty in Texas counties</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--paper:#EEF1F3;--panel:#fff;--ink:#16212B;--muted:#5B6A77;--line:#D5DCE1;--hl:#16212B}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.45 "Instrument Sans",system-ui,sans-serif}
header{padding:28px 32px 8px;max-width:1400px;margin:auto}
h1{font:700 clamp(1.7rem,3.2vw,2.5rem)/1.05 "Bricolage Grotesque",system-ui,sans-serif;letter-spacing:-.025em;margin:0 0 6px}
header p{margin:0;color:var(--muted);max-width:60ch}
.app{display:grid;grid-template-columns:minmax(0,1fr) 370px;gap:20px;max-width:1400px;margin:auto;padding:16px 32px 32px}
.card,.mapwrap{background:var(--panel);border:1px solid var(--line);border-radius:10px}
.mapwrap{padding:14px;position:relative}
.tabs{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:8px}
.tabs button{font:500 14px "Instrument Sans",sans-serif;padding:7px 13px;border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:6px;cursor:pointer}
.tabs button[aria-pressed=true]{background:var(--ink);color:#fff;border-color:var(--ink)}
button:focus-visible,input:focus-visible{outline:3px solid #4A93A5;outline-offset:2px}
#measure{font-weight:600;margin:6px 2px 0}
#map{width:100%;height:auto;display:block;cursor:grab;touch-action:none}
#map:active{cursor:grabbing}
.county{stroke:#fff;stroke-width:.6px;vector-effect:non-scaling-stroke;cursor:pointer}
.county:hover{stroke:var(--ink);stroke-width:1.4px}
.county.sel{stroke:var(--hl);stroke-width:2.6px}
.dot{fill:#fff;stroke:var(--ink);stroke-width:1px;vector-effect:non-scaling-stroke;cursor:pointer}
.dot:hover{stroke-width:3px}
.dot.sel{fill:var(--ink)}
.border{fill:none;stroke:var(--ink);stroke-width:1.6px;vector-effect:non-scaling-stroke;pointer-events:none}
#reset{position:absolute;right:20px;top:62px;font:500 13px "Instrument Sans",sans-serif;background:#fff;border:1px solid var(--line);border-radius:6px;padding:5px 10px;cursor:pointer}
#legend{margin:6px 4px 0;max-width:460px}
.sw{display:flex;height:12px}.sw i{flex:1}
.lb{display:flex;justify-content:space-between;font-size:11.5px;color:var(--muted);margin-top:3px}
.note{font-size:12.5px;color:var(--muted);margin:10px 2px 0}
aside{display:flex;flex-direction:column;gap:16px}
.card{padding:16px}
.card h2{font:700 1.15rem "Bricolage Grotesque",sans-serif;margin:0 0 10px;letter-spacing:-.01em}
label{font-weight:600;display:block;margin-bottom:6px}
input{width:100%;font:inherit;padding:9px 11px;border:1px solid var(--line);border-radius:6px}
.hint{color:var(--muted);margin:0}
.row{padding:9px 0;border-top:1px solid var(--line)}
.rl{font-size:13px;color:var(--muted)}
.rv{font:700 1.45rem "Bricolage Grotesque",sans-serif;letter-spacing:-.01em}
.bar{height:5px;background:#E4E9ED;border-radius:3px;margin:4px 0}
.bar i{display:block;height:100%;background:var(--ink);border-radius:3px}
.rk{font-size:12.5px;color:var(--muted)}
ol{list-style:none;margin:0;padding:0}
ol button{all:unset;box-sizing:border-box;display:flex;justify-content:space-between;width:100%;padding:6px 4px;border-top:1px solid var(--line);cursor:pointer}
ol button:hover{background:#F2F5F7}
ol button:focus-visible{outline:3px solid #4A93A5}
#tip{position:fixed;pointer-events:none;background:var(--ink);color:#fff;padding:5px 9px;border-radius:5px;font-size:13px;display:none;z-index:9}
@media(max-width:940px){.app{grid-template-columns:1fr;padding:12px}header{padding:20px 14px 4px}}
</style>
</head>

  rank[k] = new Map([...DATA].sort((a,b) => b[k]-a[k]).map((d,i) => [d.fips, i+1]));
});
const ord = n => { const s=["th","st","nd","rd"], v=n%100; return n+(s[(v-20)%10]||s[v]||s[0]); };
const DUR = matchMedia("(prefers-reduced-motion: reduce)").matches ? 0 : 450;
let metric = "pov", selected = null;

const svg = d3.select("#map"), tip = d3.select("#tip");
const g = svg.append("g"), gC = g.append("g"), gB = g.append("g"), gD = g.append("g");
let counties, dots, featById, path, k = 1;
const zoom = d3.zoom().scaleExtent([1, 12]).translateExtent([[0,0],[W,H]]).on("zoom", e => {
  g.attr("transform", e.transform); k = e.transform.k; dots && dots.attr("r", 3.4 / k);
});
svg.call(zoom);

const tabs = d3.select("#tabs");
KEYS.forEach(key => tabs.append("button").attr("type","button").attr("data-k",key).text(METRICS[key].tab).on("click", () => setMetric(key)));

function fillFor(f){ const r = byFips.get(f.id); return r ? scales[metric](r[metric]) : "#ccc"; }

function setMetric(key){
  metric = key; const m = METRICS[key];
  tabs.selectAll("button").attr("aria-pressed", function(){ return this.dataset.k === key; });
  d3.select("#measure").text(m.label);
  if (counties) counties.transition().duration(DUR).attr("fill", fillFor);
  const q = scales[key].quantiles(), ext = d3.extent(DATA, d => d[key]);
  const labels = [ext[0], ...q, ext[1]].map(m.lg);
  d3.select("#legend").html(
    '<div class="sw">' + m.colors.map(c => `<i style="background:${c}"></i>`).join("") + '</div>' +
    '<div class="lb">' + labels.map(l => `<span>${l}</span>`).join("") + '</div>');
  const sorted = [...DATA].sort((a,b) => m.dir === -1 ? b[key]-a[key] : a[key]-b[key]).slice(0,10);
  d3.select("#listTitle").text(m.list);
  d3.select("#list").html("").selectAll("li").data(sorted).join("li").append("button").attr("type","button")
    .html(d => `<span>${d.name}</span><b>${m.fmt(d[key])}</b>`).on("click", (e,d) => select(d.fips, true));
  if (selected) showDetail(byFips.get(selected));
}

function showDetail(d){
  const rows = KEYS.map(key => {
    const m = METRICS[key], r = rank[key].get(d.fips), pct = 100 * (N - r) / (N - 1);
    return `<div class="row"><div class="rl">${m.label}</div><div class="rv">${m.fmt(d[key])}</div>
      <div class="bar"><i style="width:${pct.toFixed(0)}%"></i></div>
      <div class="rk">${ord(r)} highest of ${N} counties · county median ${m.fmt(med[key])}</div></div>`;
  }).join("");
  d3.select("#detail").html(`<h2>${d.name}</h2><div class="rl">People in poverty, all ages</div><div class="rv" style="margin-bottom:6px">${d3.format(",")(d.n)}</div>${rows}`);
}

function select(id, doZoom){
  selected = id;
  counties.classed("sel", f => f.id === id).filter(f => f.id === id).raise();
  dots.classed("sel", f => f.id === id);
  showDetail(byFips.get(id));
  if (doZoom) {
    const f = featById.get(id), [[x0,y0],[x1,y1]] = path.bounds(f);
    const s = Math.min(8, 0.8 / Math.max((x1-x0)/W, (y1-y0)/H));
    svg.transition().duration(DUR).call(zoom.transform, d3.zoomIdentity.translate(W/2, H/2).scale(s).translate(-(x0+x1)/2, -(y0+y1)/2));
  }
}

d3.select("#reset").on("click", () => svg.transition().duration(DUR).call(zoom.transform, d3.zoomIdentity));
d3.select("#names").selectAll("option").data(DATA).join("option").attr("value", d => d.name);
d3.select("#q").on("change", function(){
  const d = DATA.find(x => x.name.toLowerCase() === this.value.trim().toLowerCase()) ||
            DATA.find(x => x.name.toLowerCase().startsWith(this.value.trim().toLowerCase()));
  if (d) { select(d.fips, true); this.value = d.name; }
});

function move(e){ tip.style("left", (e.clientX + 14) + "px").style("top", (e.clientY + 14) + "px"); }
function over(e, f){ const d = byFips.get(f.id); if (!d) return;
  tip.style("display","block").html(`<b>${d.name}</b><br>${METRICS[metric].fmt(d[metric])}`); move(e); }

setMetric("pov");
d3.json(TOPO_URL).then(topo => {
  const all = topojson.feature(topo, topo.objects.counties).features.filter(f => String(f.id).startsWith("48"));
  featById = new Map(all.map(f => [String(f.id), f]));
  all.forEach(f => f.id = String(f.id));
  const proj = d3.geoConicEqualArea().parallels([27.5, 35]).rotate([100, 0])
    .fitExtent([[12,12],[W-12,H-12]], {type:"FeatureCollection", features: all});
  path = d3.geoPath(proj);
  counties = gC.selectAll("path").data(all).join("path").attr("class","county").attr("d", path).attr("fill", fillFor)
    .on("mouseover", over).on("mousemove", move).on("mouseout", () => tip.style("display","none"))
    .on("click", (e,f) => select(f.id, false));
  gB.append("path").attr("class","border")
    .attr("d", path(topojson.mesh(topo, topo.objects.states, (a,b) => a === b && String(a.id) === "48")));
  dots = gD.selectAll("circle").data(all.filter(f => byFips.has(f.id))).join("circle").attr("class","dot")
    .attr("cx", f => path.centroid(f)[0]).attr("cy", f => path.centroid(f)[1]).attr("r", 3.4)
    .on("mouseover", over).on("mousemove", move).on("mouseout", () => tip.style("display","none"))
    .on("click", (e,f) => select(f.id, false));
}).catch(err => {
  d3.select("#measure").text("Couldn't load the county boundaries. Check your internet connection and reload.");
  console.error(err);
});
</script>
</body>
</html>
